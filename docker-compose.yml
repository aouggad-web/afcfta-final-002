version: '3.8'

services:
  mongodb:
    # Images épinglées par empreinte (audit INFO-5), relevées le 04/11/2026 :
    # une étiquette peut être republiée, une empreinte non. Pour mettre à
    # jour : docker pull mongo:7.0, puis reporter la nouvelle empreinte.
    image: mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    container_name: afcfta-mongodb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      # Utilisateur de l'application, limité à readWrite sur sa base :
      # créé par docker/mongo-init à la création du volume.
      - MONGO_DB=${MONGO_DB:-afcfta}
      - MONGO_APP_USER=${MONGO_APP_USER:?MONGO_APP_USER requis}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD requis}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - afcfta-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: afcfta-redis
    restart: unless-stopped
    user: redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Le mot de passe ne figure plus dans la ligne de commande (visible dans
    # `ps` sur l'hôte) : il passe par un fichier de configuration écrit au
    # démarrage. Mot de passe en lettres et chiffres (pas de guillemet).
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD requis}
    command:
      - sh
      - -c
      - printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - afcfta-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afcfta-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - MONGO_URL=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB:-afcfta}?authSource=${MONGO_DB:-afcfta}
      - DB_NAME=${MONGO_DB:-afcfta}
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY}
      # Origines exactes du frontend, sans valeur par défaut : l'ancienne
      # autorisait afcfta.trade (domaine tiers) et localhost, avec cookies.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS requis (origines exactes du frontend)}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-true}
      - SLACK_NOTIFICATIONS_ENABLED=${SLACK_NOTIFICATIONS_ENABLED:-false}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - POSTGRES_URL=${POSTGRES_URL:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - APP_ENV=${APP_ENV:-production}
      - UVICORN_FORWARDED_ALLOW_IPS=${UVICORN_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    tmpfs:
      - /tmp
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afcfta-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  afcfta-network:
    driver: bridge

volumes:
  mongodb_data:
