name: Cleanup Old Branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be deleted, don't actually delete)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitHub CLI
        run: |
          # GitHub CLI is pre-installed on runners
          gh --version

      - name: Delete old branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Branches à GARDER
          KEEP_BRANCHES="^(main|claude/setup-github-cli-EngUf|automated-data-update-135)$"

          # Branches à SUPPRIMER (regex)
          DELETE_REGEX="^(automated-data-update-[0-9]+|claude/(format-black-isort|wto-auth-fix)|codex/|copilot/|conflict_|replit|fix/).*$"

          echo "🔍 Récupération des branches..."
          DELETED_COUNT=0
          KEPT_COUNT=0

          # Récupérer les branches via gh
          while IFS= read -r branch; do
            # Sauter les branches vides
            [[ -z "$branch" ]] && continue

            # Vérifier si c'est une branche à garder
            if echo "$branch" | grep -qE "$KEEP_BRANCHES"; then
              echo "✓ Gardée: $branch"
              ((KEPT_COUNT++))
              continue
            fi

            # Vérifier si elle doit être supprimée
            if echo "$branch" | grep -qE "$DELETE_REGEX"; then
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "🗑️  (dry-run) Serait supprimée: $branch"
              else
                echo "🗑️  Suppression: $branch"
                gh api repos/${{ github.repository }}/git/refs/heads/"$branch" -X DELETE 2>/dev/null && echo "  ✓ Supprimée" || echo "  ⚠️  Erreur ou déjà supprimée"
              fi
              ((DELETED_COUNT++))
            fi
          done < <(gh api repos/${{ github.repository }}/branches --paginate -q '.[].name')

          echo ""
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "✅ Dry run: $DELETED_COUNT branches auraient été supprimées"
          else
            echo "✅ Suppression complète: $DELETED_COUNT branches supprimées, $KEPT_COUNT conservées"
          fi

          # Retourner succès
          exit 0
