name: Update Bulk Freight Indices

on:
  # Jours ouvrés à 06:00 UTC (les indices Baltic sont publiés en journée
  # ouvrée de Londres ; marchés fermés le week-end).
  schedule:
    - cron: '0 6 * * 1-5'

  # Déclenchement manuel possible
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-bulk-freight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Script en stdlib pure — aucune dépendance à installer. En l'absence de
      # flux Baltic configuré (BALTIC_INDEX_JSON), toutes les classes retombent
      # sur le multiplicateur statique 1,0 daté (repli, zéro fabrication).
      - name: Refresh bulk freight multipliers
        id: fetch
        run: python backend/etl/update_bulk_freight_indices.py

      - name: Validate output against backend loader
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'backend')
          import logistics_bulk_fees_data as bulk
          ov = bulk._load_freight_overrides()
          assert set(ov) == set(bulk.VESSEL_CLASSES), "fret_vraquier.json illisible/incomplet"
          for cls, entry in ov.items():
              lo, hi = bulk._MULTIPLIER_BOUNDS
              assert lo <= entry["multiplier"] <= hi, f"multiplicateur {cls} hors bornes"
              assert entry.get("as_of") and entry.get("source"), f"{cls} sans as_of/source"
          print(f"Backend lit {len(ov)} classes vraquier : OK")
          EOF

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet -- data/json/fret_vraquier.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): indices fret vraquier du jour (update_bulk_freight #${{ github.run_number }})"
          committer: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          author: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          branch: automated-bulk-freight
          delete-branch: true
          title: "chore(data): mise à jour des indices de fret vraquier"
          body: |
            ## Mise à jour automatique des indices de fret vraquier (Baltic)

            Rafraîchit `data/json/fret_vraquier.json`, lu par
            `backend/logistics_bulk_fees_data.py` (multiplicateur de marché
            par classe de navire appliqué au modèle distance-coût).

            **Run :** #${{ github.run_number }} · **Déclencheur :** ${{ github.event_name }}

            Chaque classe porte son multiplicateur (indice courant / référence
            2024), sa date et sa source. Une classe en échec ou hors bornes de
            vraisemblance reste au repli statique 1,0 daté (zéro fabrication).

            La branche est fixe (`automated-bulk-freight`) : une PR déjà
            ouverte est mise à jour au lieu d'en créer une nouvelle.
          labels: |
            automated
            data-update

      - name: Summary
        if: always()
        run: |
          echo "## Indices fret vraquier — $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ Indices mis à jour — PR créée/actualisée" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Aucun changement (repli statique inchangé)" >> $GITHUB_STEP_SUMMARY
          fi
