name: Update Bulk Freight Indices

on:
  # Jours ouvrés à 06:00 UTC (les indices Baltic sont publiés en journée
  # ouvrée de Londres ; marchés fermés le week-end).
  schedule:
    - cron: '0 6 * * 1-5'

  # Déclenchement manuel possible
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-bulk-freight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Script en stdlib pure — aucune dépendance à installer. Récupère le cours
      # de l'ETF BDRY (proxy du marché vrac sec) via l'API publique Yahoo
      # Finance. Si le cours échoue ou sort des bornes de vraisemblance, toutes
      # les classes retombent sur le multiplicateur statique 1,0 daté (repli,
      # zéro fabrication).
      - name: Refresh bulk freight market factor (BDRY proxy)
        id: fetch
        run: python backend/etl/update_bulk_freight_indices.py

      - name: Validate output against backend loader
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'backend')
          import logistics_bulk_fees_data as bulk
          ov = bulk._load_freight_overrides()
          assert set(ov) == set(bulk.VESSEL_CLASSES), "fret_vraquier.json illisible/incomplet"
          for cls, entry in ov.items():
              lo, hi = bulk._MULTIPLIER_BOUNDS
              assert lo <= entry["multiplier"] <= hi, f"multiplicateur {cls} hors bornes"
              assert entry.get("as_of") and entry.get("source"), f"{cls} sans as_of/source"
          print(f"Backend lit {len(ov)} classes vraquier : OK")
          EOF

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet -- data/json/fret_vraquier.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): facteur de marché fret vraquier du jour (update_bulk_freight #${{ github.run_number }})"
          committer: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          author: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          branch: automated-bulk-freight
          delete-branch: true
          title: "chore(data): mise à jour du facteur de marché fret vraquier"
          body: |
            ## Mise à jour automatique du facteur de marché fret vraquier

            Rafraîchit `data/json/fret_vraquier.json`, lu par
            `backend/logistics_bulk_fees_data.py` (facteur de marché appliqué
            au modèle distance-coût, par classe de navire).

            **Run :** #${{ github.run_number }} · **Déclencheur :** ${{ github.event_name }}

            Facteur = cours de l'ETF BDRY (proxy marché vrac sec) vs sa moyenne
            glissante 12 mois, avec sa date de marché et sa source. Proxy, pas
            l'indice Baltic par classe. Cours en échec ou hors bornes de
            vraisemblance → repli statique 1,0 daté (zéro fabrication).

            La branche est fixe (`automated-bulk-freight`) : une PR déjà
            ouverte est mise à jour au lieu d'en créer une nouvelle.
          labels: |
            automated
            data-update

      - name: Summary
        if: always()
        run: |
          echo "## Facteur marché fret vraquier — $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ Facteur de marché mis à jour — PR créée/actualisée" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Aucun changement (repli statique inchangé)" >> $GITHUB_STEP_SUMMARY
          fi
