name: Tarifs douaniers — Crawl Scrapling (par pays)

# Plan : docs/PLAN_SCRAPLING_CRAWLERS.md.
# Un run = un pays. mode=validate : crawl + gate, artefacts seulement.
# mode=publish : si gate PASS, commit sur une branche crawl/{iso3} + PR
# automatique (jamais de commit direct sur main — revue du rapport qualité).
# Étalon Algérie : le gate compare au dataset authentique existant + pivots CSV.

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Pays à crawler (ISO3)'
        required: true
        default: 'DZA'
      mode:
        description: 'validate = artefacts seulement ; publish = PR si PASS'
        required: true
        type: choice
        options: [validate, publish]
        default: 'validate'
      max_positions:
        description: 'Borne de positions (vide = tout) — pour les essais'
        required: false
        default: ''
      chapters:
        description: 'Chapitres SH ciblés, séparés par des virgules (ex. 01,02) — crawl par tranches'
        required: false
        default: ''
      require_national_layer:
        description: 'Exiger la couche nationale (taxes hors DD + formalités + régimes) — pays de blocs TEC/CET'
        required: false
        type: boolean
        default: false
      diag_hs:
        description: 'DIAGNOSTIC : codes SH à dumper (HTML live vs committé). Si rempli, saute crawl/gate/publish.'
        required: false
        default: ''
      recon:
        description: 'RECONNAISSANCE : sonder les portails douaniers nationaux (opt. ISO3 séparés par espace). Si rempli, saute crawl/gate/publish.'
        required: false
        default: ''
      recon_js:
        description: 'RECON JS : capturer l API XHR d une SPA via Playwright (URL). Si rempli, saute crawl/gate/publish.'
        required: false
        default: ''
      source:
        description: 'Source des donnees : spec (portail national dedie) ou wits (WITS/TRAINS SH6, DD seul)'
        required: false
        type: choice
        options: [spec, wits]
        default: 'spec'

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  crawl-country:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-crawl.txt

      - name: Install crawl dependencies (isolées)
        working-directory: backend
        run: |
          pip install -r requirements-crawl.txt
          python -m playwright install chromium --with-deps

      - name: Diagnostic HTML live (si diag_hs rempli)
        if: ${{ inputs.diag_hs != '' }}
        working-directory: backend
        env:
          HS_CODES: ${{ inputs.diag_hs }}
        run: |
          python -m crawlers.scrapling_engine.diag_dza $HS_CODES

      - name: Reconnaissance des portails douaniers (si recon rempli)
        if: ${{ inputs.recon != '' }}
        working-directory: backend
        env:
          RECON_ARGS: ${{ inputs.recon }}
        run: |
          # 'all' = sonder tous les portails candidats ; sinon liste ISO3.
          if [ "$RECON_ARGS" = "all" ]; then
            python -m crawlers.scrapling_engine.recon
          else
            python -m crawlers.scrapling_engine.recon $RECON_ARGS
          fi

      - name: Reconnaissance SPA JS via Playwright (si recon_js rempli)
        if: ${{ inputs.recon_js != '' }}
        working-directory: backend
        env:
          RECON_JS_URLS: ${{ inputs.recon_js }}
        run: |
          python -m crawlers.scrapling_engine.recon_js $RECON_JS_URLS

      - name: Crawl du pays
        id: crawl
        if: ${{ inputs.diag_hs == '' && inputs.recon == '' && inputs.recon_js == '' }}
        working-directory: backend
        timeout-minutes: 60
        env:
          COUNTRY: ${{ inputs.country }}
          MAXPOS: ${{ inputs.max_positions }}
          CRAWL_CHAPTERS: ${{ inputs.chapters }}
        run: |
          ARGS=(--country "$COUNTRY" --out "/tmp/${COUNTRY}_tariffs.json" --source "${{ inputs.source }}")
          if [ -n "$MAXPOS" ]; then ARGS+=(--max-positions "$MAXPOS"); fi
          python -m crawlers.scrapling_engine.runner "${ARGS[@]}"

      - name: Gate qualité (étalon + pivots si disponibles)
        id: gate
        if: ${{ inputs.diag_hs == '' && inputs.recon == '' && inputs.recon_js == '' }}
        working-directory: backend
        env:
          COUNTRY: ${{ inputs.country }}
        run: |
          GATE_ARGS=(--candidate "/tmp/${COUNTRY}_tariffs.json")
          # Étalon : dataset crawlé authentique existant (obligatoire pour DZA).
          # Comparaison restreinte aux CHAPITRES crawlés (crawl par tranches).
          if [ -f "data/crawled/${COUNTRY}_tariffs.json" ]; then
            GATE_ARGS+=(--reference "data/crawled/${COUNTRY}_tariffs.json")
          fi
          # Pivots CSV vérifiés (DZA / MAR / TUN)
          if [ -f "../frontend/public/${COUNTRY}_tarif_douanier_echantillon.csv" ]; then
            GATE_ARGS+=(--pivots "../frontend/public/${COUNTRY}_tarif_douanier_echantillon.csv")
          fi
          # Pays d'un bloc régional : exiger la couche nationale (pas le TEC seul)
          if [ "${{ inputs.require_national_layer }}" = "true" ]; then
            GATE_ARGS+=(--require-national-layer)
          fi
          # Le rapport va dans un fichier ; le CODE RETOUR du gate est capturé
          # (le pipe |tee l'avalait). VERDICT exposé comme sortie d'étape.
          set +e
          python -m crawlers.scrapling_engine.quality_gate "${GATE_ARGS[@]}" \
            > "/tmp/${COUNTRY}_gate_report.json"
          GATE_RC=$?
          set -e
          cat "/tmp/${COUNTRY}_gate_report.json"
          if [ "$GATE_RC" -eq 0 ]; then VERDICT=PASS; else VERDICT=FAIL; fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "Verdict du gate : $VERDICT (rc=$GATE_RC)"
          # En mode publish, un gate FAIL doit faire échouer le job (pas de
          # publication de données non validées). En validate, on n'échoue pas.
          if [ "${{ inputs.mode }}" = "publish" ] && [ "$VERDICT" = "FAIL" ]; then
            echo "::error::Gate FAIL en mode publish — aucune publication." ; exit 1
          fi

      - name: Upload artefacts (JSON + rapport de gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarifs-${{ inputs.country }}
          path: |
            /tmp/${{ inputs.country }}_tariffs.json
            /tmp/${{ inputs.country }}_gate_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publier (branche crawl/{iso3} + PR) — uniquement si gate PASS
        if: ${{ inputs.diag_hs == '' && inputs.recon == '' && inputs.recon_js == '' && inputs.mode == 'publish' && steps.gate.outputs.verdict == 'PASS' }}
        env:
          COUNTRY: ${{ inputs.country }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISO_LOWER=$(echo "$COUNTRY" | tr '[:upper:]' '[:lower:]')
          BRANCH="crawl/${ISO_LOWER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Brancher depuis main (pas la branche d'infra) : la PR pays ne
          # contient QUE le fichier de données, pas tout le code du crawler.
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          # IMPORTANT : les datasets vivent dans backend/data/crawled (lu par
          # authentic_tariff_service). Cette étape tourne à la RACINE du repo
          # (pas de working-directory: backend) -> chemin backend/ explicite.
          mkdir -p backend/data/crawled
          cp "/tmp/${COUNTRY}_tariffs.json" "backend/data/crawled/${COUNTRY}_tariffs.json"
          git add "backend/data/crawled/${COUNTRY}_tariffs.json"
          if git diff --cached --quiet; then
            echo "Dataset ${COUNTRY} inchangé — pas de PR."
            exit 0
          fi
          git commit -m "data(crawl): tarifs douaniers ${COUNTRY} (WITS/TRAINS, gate PASS)"
          git push -f origin "$BRANCH"
          gh pr create \
            --base main --head "$BRANCH" --draft \
            --title "data(crawl): tarifs douaniers ${COUNTRY} (gate PASS)" \
            --body "$(printf 'Crawl Scrapling %s — gate qualité PASS (rapport en artefact du run %s).\n\nPlan : docs/PLAN_SCRAPLING_CRAWLERS.md — revue du rapport avant merge.' "$COUNTRY" "${{ github.run_id }}")" \
            || echo "PR déjà existante pour $BRANCH — mise à jour par le push."
