name: Tarifs — Diagnostic DZA (HTML live vs committé)

# Diagnostic ponctuel : tranche la divergence étalon (JSON committé vs crawl
# frais) en imprimant le HTML LIVE des pages sous-position litigieuses.
# Aucune publication — logs seulement. Voir crawlers/scrapling_engine/diag_dza.py.

on:
  workflow_dispatch:
    inputs:
      hs_codes:
        description: 'Codes SH à diagnostiquer (séparés par des espaces)'
        required: false
        default: '2710121100 2710121900 0402213400 0401101000 0101299100 2707301000 2711292100'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: backend
        run: pip install httpx beautifulsoup4
      - name: Dump HTML live des positions
        working-directory: backend
        env:
          HS_CODES: ${{ inputs.hs_codes }}
        run: |
          python -m crawlers.scrapling_engine.diag_dza $HS_CODES
