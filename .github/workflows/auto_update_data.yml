name: Auto Update Data

on:
  # Run daily at 2:00 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update to perform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - worldbank
          - production
          - trade

permissions:
  contents: write
  actions: read
  pull-requests: write  # required for PR creation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl pandas pymongo

      - name: Validate environment
        run: |
          python -c "import requests, openpyxl, pandas, pymongo; print('Environment OK')"

      - name: Run data update script
        id: update
        run: |
          echo "Starting data update..."
          python backend/update_data_automated.py
          echo "update_status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT
          git diff --name-only

      # Les données sont le produit : une sortie corrompue ne doit jamais
      # atteindre une PR. Comme la CI ne se déclenche pas sur les PR ouvertes
      # par GITHUB_TOKEN (voir la note sur `token` ci-dessous), cette
      # vérification est parfois la seule qui s'exécutera.
      - name: Validate updated JSON
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          set -e
          FAILED=0
          for f in $(git diff --name-only -- '*.json'); do
            if ! python -c "import json,sys; json.load(open('$f'))"; then
              echo "::error file=$f::JSON invalide après mise à jour"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          # GitHub ne déclenche AUCUN workflow sur les événements produits par
          # GITHUB_TOKEN (garde-fou anti-boucle). Une PR ouverte avec ce jeton
          # n'exécute donc jamais ci.yml : elle reste sans aucun check, donc
          # « unstable », et personne ne la fusionne — c'est ce qui a laissé
          # une trentaine de PR de données s'accumuler.
          # Renseignez le secret DATA_BOT_TOKEN (PAT à portée `repo`, ou jeton
          # d'application GitHub) pour que la CI s'exécute normalement.
          token: ${{ secrets.DATA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): automated data update - ${{ github.run_number }}"
          committer: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          author: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          # Branche FIXE, volontairement. Un nom incluant le numéro de run
          # créait une branche et une PR par jour, sans jamais refermer les
          # précédentes. Avec une branche stable, create-pull-request met à
          # jour la PR existante : une seule PR roulante, toujours porteuse des
          # données les plus fraîches.
          branch: automated-data-update
          delete-branch: true
          title: "chore(data): automated data update - run ${{ github.run_number }}"
          body: |
            ## Automated Data Update

            This PR contains automated data updates from external sources.

            **Run:** #${{ github.run_number }}
            **Workflow:** ${{ github.workflow }}
            **Triggered:** ${{ github.event_name }}

            ### Changes
            - Updated World Bank data
            - Updated OEC data
            - Updated production data

            Le JSON produit a été validé (parsing) avant l'ouverture de cette PR.

            Cette PR est **roulante** : chaque exécution quotidienne la met à
            jour au lieu d'en ouvrir une nouvelle. Fusionnez-la quand vous le
            souhaitez, elle repartira des données suivantes.

            > **Checks absents ?** GitHub n'exécute aucun workflow sur les
            > événements produits par `GITHUB_TOKEN`. Renseignez le secret
            > `DATA_BOT_TOKEN` (PAT à portée `repo`) pour que la CI s'exécute
            > sur cette PR.
            >
            > **PR non créée ?** Settings > Actions > General > activez
            > « Allow GitHub Actions to create and approve pull requests ».
          labels: |
            automated
            data-update
          add-paths: |
            *.json
            *.csv
            *.xlsx
      
      - name: Create update summary
        if: always()
        run: |
          echo "## Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data_update_report.json ]; then
            echo "### Update Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat data_update_report.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ Data was updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No data changes" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-update-report-${{ github.run_number }}
          path: |
            data_update_report.json
            worldbank_data_latest.json
          retention-days: 30
