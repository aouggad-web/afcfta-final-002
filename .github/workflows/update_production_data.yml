name: Update Production Data (FAOSTAT)

on:
  # Mensuel — FAOSTAT met à jour le domaine QCL quelques fois par an ;
  # un passage par mois suffit largement pour capter chaque nouvelle vague.
  schedule:
    - cron: '0 4 3 * *'

  # Déclenchement manuel possible
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Le script est en stdlib pure (csv/zipfile/json) pour ce chemin —
      # aucune dépendance à installer. Il télécharge le bulk FAOSTAT QCL
      # Afrique (réseau ouvert sur les runners GitHub, contrairement aux
      # sandbox de développement) et retombe sur les données curées si le
      # réseau échoue — jamais de valeur inventée.
      #
      # UNIDO (manufacturing) n'est PAS automatisable ici : INDSTAT4 n'a pas
      # d'endpoint de téléchargement libre (portail avec licence). La section
      # manufacturing reste donc curée dans backend/etl/unido_data.py, et le
      # backend affiche un garde-fou de couverture (coverage_caveat) partout
      # où moins de 3 pays sont disponibles pour un secteur.
      - name: Rebuild production dataset from FAOSTAT bulk
        run: python backend/scripts/build_production_faostat_usgs.py --force-download

      # L'API World Bank est libre et sans clé. Non bloquant : si elle est
      # injoignable, etl/macro_wdi_data.py garde les valeurs déjà committées —
      # jamais de valeur inventée, jamais d'échec du mois entier pour ça.
      - name: Refresh World Bank WDI macro series
        continue-on-error: true
        working-directory: backend
        run: python scripts/fetch_wdi_macro.py

      # Même politique que WDI : l'API UNSD est libre et sans clé ; si elle est
      # injoignable, etl/unsd_manufacturing_data.py garde les valeurs déjà
      # committées. Sans cette étape, la dimension manufacturière mesurée
      # resterait figée pendant que les autres sources se rafraîchissent.
      - name: Refresh UNSD measured manufacturing series
        continue-on-error: true
        working-directory: backend
        run: python scripts/fetch_unsd_manufacturing.py

      # ÉTAPE INDISPENSABLE, et longtemps absente : le script de construction
      # ci-dessus n'écrit que le socle (macro et mines dans leur version
      # minimale). Les dimensions complètes — macro World Bank, minéraux
      # étendus, prévisions OCDE-FAO — sont posées par la surcouche
      # idempotente. Sans elle, le passage mensuel FAIT RÉGRESSER le fichier :
      # macro retombe de ~5 000 à 162 enregistrements et les mines de 432 à
      # 166. Le garde-fou de l'étape suivante couvre désormais ce cas.
      - name: Apply enrichment layer (macro WDI, mining, FAO projections)
        working-directory: backend
        run: python scripts/enrich_production_data.py

      - name: Validate rebuilt dataset against backend services
        run: |
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, 'backend')

          data = json.load(open('data/json/production_africaine.json'))
          counts = data['metadata']['record_counts']
          # Garde-fous anti-régression : le bulk FAOSTAT Afrique fait ~9-10k
          # enregistrements ; une chute sous 5 000 signale un zip tronqué ou
          # un changement de format — on échoue plutôt que de committer.
          assert counts['agriculture'] >= 5000, f"agri: {counts['agriculture']} < 5000"
          # Seuils calés sur la surcouche d'enrichissement, pas sur le socle :
          # 432 enregistrements miniers et ~5 000 macro. Les anciens seuils
          # (mining >= 100) laissaient passer un fichier amputé de sa
          # surcouche — le socle seul en compte 166 et 162.
          assert counts['mining'] >= 400, f"mining: {counts['mining']} < 400"
          assert counts['macro'] >= 4000, f"macro: {counts['macro']} < 4000"
          assert counts.get('manufacturing_unsd', 0) >= 800, (
              f"manufacturing_unsd: {counts.get('manufacturing_unsd', 0)} < 800")

          from services import production_capacity_service as pcs
          # Vérités de terrain stables : la Côte d'Ivoire doit rester visible
          # parmi les producteurs de cacao, l'Éthiopie parmi ceux du café.
          cocoa = pcs.get_continental_producers('1801')
          assert cocoa['available'] and any(
              p['country_iso3'] == 'CIV' for p in cocoa['top_producers']
          ), 'CIV absent du top cacao — ingestion suspecte'
          coffee = pcs.get_continental_producers('0901')
          assert coffee['available'] and any(
              p['country_iso3'] == 'ETH' for p in coffee['top_producers']
          ), 'ETH absent du top café — ingestion suspecte'
          latest = max(r['year'] for r in data['agri_faostat'])
          print(f"OK — agri {counts['agriculture']}, mines {counts['mining']}, "
                f"dernière année agri {latest}")
          EOF

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet -- data/json/production_africaine.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): production africaine FAOSTAT du mois (update_production_data #${{ github.run_number }})"
          committer: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          author: afcfta-data-bot <afcfta-data-bot@users.noreply.github.com>
          branch: automated-production-data
          delete-branch: true
          title: "chore(data): mise à jour mensuelle production africaine (FAOSTAT)"
          body: |
            ## Mise à jour automatique des données de production

            Rafraîchit `data/json/production_africaine.json` depuis le bulk
            officiel FAOSTAT QCL Afrique (production agricole, 54 pays,
            toutes les années publiées). Lu par
            `backend/services/production_capacity_service.py` (module
            Opportunités : producteurs continentaux, capacités, scénarios).

            **Run :** #${{ github.run_number }} · **Déclencheur :** ${{ github.event_name }}

            Validations passées avant cette PR : volume d'enregistrements
            (≥ 5 000 agri), vérités de terrain (CIV dans le top cacao, ETH
            dans le top café), lisibilité par le backend.

            **Périmètre** : agriculture (FAOSTAT, automatique),
            mines/énergie (USGS, table curée multi-années) et manufacturing
            mesuré (UNSD, API libre et sans clé, rafraîchi par ce même
            passage). UNIDO INDSTAT4 reste fermé (403) : le détail par
            division ISIC qui en dépend demeure curé à la main, et le
            backend affiche un garde-fou de couverture là où il est
            incomplet.

            La branche est fixe (`automated-production-data`) : si une PR
            de données est déjà ouverte, elle est mise à jour au lieu d'en
            créer une nouvelle chaque mois.
          labels: |
            automated
            data-update

      - name: Summary
        if: always()
        run: |
          echo "## Production africaine — $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ Données mises à jour — PR créée/actualisée" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Aucun changement de données FAOSTAT" >> $GITHUB_STEP_SUMMARY
          fi
