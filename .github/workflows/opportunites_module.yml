name: Module Opportunités — Exécution

# Exécution manuelle du module Opportunités depuis GitHub :
#   1. ETL World Bank (PIB/hab → L3 des besoins ; réserves → couverture d'import) ;
#   2. Démarrage du backend FastAPI ;
#   3. Smoke-test des endpoints (S2/S3/bilatéral) — par défaut : noix de cajou
#      brutes (SH 080131) de Guinée-Bissau vers l'Algérie ;
#   4. Publication des rapports JSON + datasets WB en artefacts.
#
# Sur un runner GitHub le réseau est ouvert : l'API World Bank répond, et l'OEC
# aussi si le secret OEC_API_TOKEN est configuré (sinon dégradation gracieuse).
# Optionnel : committer les datasets WB sur la branche (commit_wb_data).

on:
  workflow_dispatch:
    inputs:
      hs_code:
        description: 'Code SH du produit'
        required: false
        default: '080131'
      producer:
        description: 'Pays producteur/exportateur (ISO3)'
        required: false
        default: 'GNB'
      destination:
        description: 'Marché cible ISO3 (vide = meilleur marché classé par S2)'
        required: false
        default: 'DZA'
      top_k:
        description: 'Nombre de marchés analysés en profondeur (S2)'
        required: false
        default: '5'
      run_wb_etl:
        description: 'Lancer les ETL World Bank (PIB/hab + réserves)'
        required: false
        type: boolean
        default: true
      commit_wb_data:
        description: 'Committer les datasets WB produits sur la branche'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write  # PR des données quand le workflow tourne sur main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-module:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # jeton fourni à la seule étape qui pousse

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run World Bank ETL (GDP per capita + reserves)
        if: ${{ inputs.run_wb_etl }}
        working-directory: backend
        # Non bloquant : le module dégrade gracieusement sans ces datasets.
        continue-on-error: true
        run: |
          python -m etl.fetch_wb_gdp
          python -m etl.fetch_wb_reserves

      - name: Start backend
        working-directory: backend
        env:
          PUBLIC_DATA_ACCESS: 'true'
          OEC_API_TOKEN: ${{ secrets.OEC_API_TOKEN }}
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          nohup python -m uvicorn server:app --port 8000 > ../uvicorn.log 2>&1 &
          echo "Waiting for backend readiness..."
          timeout 180 bash -c \
            'until curl -sf http://localhost:8000/api/reports/health > /dev/null; do sleep 2; done'
          echo "Backend ready."

      - name: Smoke-test Opportunités (S2 + S3 + bilatéral ultra-fin)
        working-directory: backend
        env:
          HS_CODE: ${{ inputs.hs_code }}
          PRODUCER: ${{ inputs.producer }}
          DESTINATION: ${{ inputs.destination }}
          TOP_K: ${{ inputs.top_k }}
        run: |
          DEST_FLAG=()
          if [ -n "$DESTINATION" ]; then
            DEST_FLAG=(--destination "$DESTINATION")
          fi
          python -m scripts.smoke_opportunites \
            --hs-code "$HS_CODE" \
            --producer "$PRODUCER" \
            --top-k "$TOP_K" \
            "${DEST_FLAG[@]}" \
            --out-dir ../test_reports/smoke_opportunites

      # GitHub masque les secrets dans les logs d'étape, pas dans les artefacts :
      # on retire du journal toute clé passée en paramètre d'URL avant l'envoi.
      # Seconde barrière : backend/log_redaction.py masque déjà le journal de
      # l'application et celui d'uvicorn ; même liste de paramètres.
      - name: Redact secrets from uvicorn.log
        if: always()
        run: |
          if [ -f uvicorn.log ]; then
            sed -i -E 's/([?&#](token|access_token|refresh_token|api_key|apikey|key|subscription-key|token_hash|code|password|secret|client_secret|signature|license_key)=)[^&[:space:]"#]+/\1***/Ig' uvicorn.log
          fi

      - name: Upload reports and datasets as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opportunites-${{ inputs.hs_code }}-${{ inputs.producer }}
          path: |
            test_reports/smoke_opportunites/
            data/json/wb_gdp_pc.json
            data/json/wb_reserves.json
            uvicorn.log
          if-no-files-found: warn
          retention-days: 30

      - name: Commit World Bank datasets to branch
        if: ${{ inputs.commit_wb_data }}
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Identifiants git pour cette étape seulement : le checkout n'en
          # garde aucun. DATA_BOT_TOKEN s'il existe (la CI tourne alors sur la
          # PR), sinon GITHUB_TOKEN.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          # N'ajouter que les fichiers réellement produits (l'ETL est non
          # bloquant : en cas de timeout WB, ne pas faire échouer le job ici).
          added=0
          for f in data/json/wb_gdp_pc.json data/json/wb_reserves.json; do
            if [ -f "$f" ]; then git add "$f"; added=1; else echo "⚠ $f absent (ETL en échec ?) — ignoré"; fi
          done
          if [ "$added" = "0" ] || git diff --cached --quiet; then
            echo "Aucun dataset WB nouveau — rien à committer."
          else
            git commit -m "data: datasets World Bank (PIB/hab + réserves) via workflow"
            # main est protégée (PR et vérifications obligatoires) : lancé sur
            # main, le workflow pousse une branche dédiée et ouvre une PR ;
            # lancé sur une autre branche, il y pousse comme avant.
            if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
              branche="data/world-bank-$GITHUB_RUN_ID"
              git_auth push origin "HEAD:refs/heads/$branche"
              gh pr create --base "$GITHUB_REF_NAME" --head "$branche" \
                --title "data: datasets World Bank (PIB/hab + réserves) via workflow" \
                --body "PR ouverte par le workflow (run $GITHUB_RUN_ID). Sans le secret DATA_BOT_TOKEN, elle est ouverte avec GITHUB_TOKEN : relancer depuis la PR son exécution CI « pull_request » pour obtenir les vérifications obligatoires."
            else
              git_auth push
            fi
          fi
