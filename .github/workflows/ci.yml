name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail fast on unresolved merge conflict markers
        shell: bash
        run: |
          if git ls-files -z | xargs -0 grep -rlP '^(<{7}|={7}|>{7})( .*)?$' -- 2>/dev/null; then
            echo "ERROR: Unresolved merge conflict markers found in the tracked files above." >&2
            exit 1
          fi
          echo "No conflict markers found."

  lint:
    needs: check-conflict-markers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: pip install flake8==7.3.0 black==25.9.0 isort==6.1.0

      - name: Lint — real-bug gate (undefined names, syntax errors)
        run: python -m flake8 .

      # Format check global retiré (black/isort sur tout le repo) : le formatage
      # est appliqué au périmètre des fichiers modifiés par chaque PR, pas au
      # dépôt entier — voir commit 0a082643 (revert du reformatage global).
      # Le gate flake8 ci-dessus reste le garde-fou des vrais bugs (F821, syntaxe).

  backend-tests:
    needs: check-conflict-markers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest feedparser aiohttp pandas numpy

      - name: Run backend tests
        run: |
          python -m pytest tests/test_health_endpoint.py tests/test_north_africa_uma.py -v --tb=short

      - name: Run backend unit tests
        run: |
          python -m pytest backend/tests/ -v --tb=short --ignore=backend/tests/test_notifications.py

  frontend-build:
    needs: check-conflict-markers
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Run frontend tests
        run: yarn test

      - name: Build frontend
        run: yarn build
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: http://localhost:8000
