name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail fast on unresolved merge conflict markers
        shell: bash
        run: |
          if git ls-files -z | xargs -0 grep -rlP '^(<{7}|={7}|>{7})( .*)?$' -- 2>/dev/null; then
            echo "ERROR: Unresolved merge conflict markers found in the tracked files above." >&2
            exit 1
          fi
          echo "No conflict markers found."

  backend-tests:
    needs: check-conflict-markers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest feedparser aiohttp pandas numpy

      - name: Run backend tests
        run: |
          python -m pytest tests/test_health_endpoint.py tests/test_north_africa_uma.py -v --tb=short

      - name: Run backend unit tests
        run: |
          python -m pytest backend/tests/ -v --tb=short --ignore=backend/tests/test_notifications.py
        continue-on-error: true

  frontend-build:
    needs: check-conflict-markers
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: http://localhost:8000
