name: Audit des dépendances

# Audit de sécurité, constat D9 (16/11/2026) : la vulnérabilité de soupsieve
# n'avait été vue qu'à la main ; aucune tâche ne rejouait pip-audit ni
# yarn audit. Chaque lundi, à la demande, et dans toute PR qui touche un
# fichier de dépendances, ce workflow échoue sur toute vulnérabilité connue
# des dépendances Python et sur toute vulnérabilité de gravité modérée ou
# plus des dépendances de production de l'interface : GitHub prévient alors
# par e-mail.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'backend/requirements*.txt'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - '.github/workflows/audit_dependances.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # aucun push : pas de jeton laissé dans .git/config

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Installer pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: pip-audit (racine, backend, collecte)
        run: |
          set -u
          statut=0
          for fichier in requirements.txt backend/requirements.txt backend/requirements-crawl.txt; do
            echo "::group::${fichier}"
            python -m pip_audit -r "${fichier}" --progress-spinner off || statut=1
            echo "::endgroup::"
          done
          exit "${statut}"

  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # aucun push : pas de jeton laissé dans .git/config

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Lit yarn.lock seulement : aucune installation, aucun script exécuté.
      - name: yarn audit (dépendances de production, gravité modérée et plus)
        run: yarn audit --groups dependencies --level moderate
